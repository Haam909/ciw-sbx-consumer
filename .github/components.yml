# .github/components.yml - proof runs for #18 and #19: components whose
# dependency is a package on GitHub Packages (#18) or on the org-scoped Azure
# Artifacts Feed (#19), published by Haam909/ciw-sbx-feeds.
components:
  - name: dotnet-consumer
    runtime: dotnet
    target: none
    project: src/dotnet-consumer/DotnetConsumer.csproj
    dotnet-version: '10.0.x'

  - name: node-consumer
    runtime: node
    target: none
    path: src/node-consumer

  - name: dotnet-org-consumer
    runtime: dotnet
    target: none
    project: src/dotnet-org-consumer/DotnetOrgConsumer.csproj
    dotnet-version: '10.0.x'

  - name: node-org-consumer
    runtime: node
    target: none
    path: src/node-org-consumer

  - name: py-org-consumer
    runtime: python
    target: none
    path: src/py-org-consumer
